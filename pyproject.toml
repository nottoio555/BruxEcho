[project]
name = "bruxecho"
version = "0.1.0"
description = "Sleep bruxism (tooth-grinding) sound detection from phone microphone recordings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "streamlit>=1.38",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
